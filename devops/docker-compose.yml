name: public-deploy-server

services:
  deploy-server-infisical:
    image: infisical/infisical:latest
    container_name: deploy-server-infisical
    restart: "no"
    user: "0:0"

    env_file:
      - /home/davidev/projects/secrets/deploy-server-infisical.env

    networks:
      - proxy-net

    volumes:
      - infisical_env:/infisical-env
      - /home/davidev/projects/scripts/write-infisical-env-file.sh:/scripts/write-infisical-env-file.sh:ro

    entrypoint:
      - /bin/sh

    command:
      - /scripts/write-infisical-env-file.sh
  deploy-server-app:
    image: nginx:alpine
    container_name: deploy-server-app
    restart: unless-stopped
    depends_on:
      deploy-server-infisical:
        condition: service_completed_successfully
    networks:
      - proxy-net
    volumes:
      - ../app:/usr/share/nginx/html:ro
      - infisical_env:/infisical-env:ro

  deploy-server-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: deploy-server-cloudflared
    restart: unless-stopped
    depends_on:
      - deploy-server-app
    networks:
      - proxy-net
    command: tunnel --no-autoupdate --url http://deploy-server-app:80

volumes:
  infisical_env:

networks:
  proxy-net:
    external: true
